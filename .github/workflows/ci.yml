name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Project validation
    runs-on: windows-2025
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
      - name: Verify metadata and sidecars
        shell: pwsh
        run: ./.github/scripts/verify-project.ps1
      - name: Test presentation ordering
        shell: pwsh
        run: ./src-tauri/binaries/qjs-x86_64-pc-windows-msvc.exe -I ui/presentation-order.js tools/presentation-order.test.js

  rust:
    name: Rust (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: windows-2025
            run_format: true
          - name: macOS
            runner: macos-15
            run_format: false
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Cache Rust build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri -> target
      - name: Mark macOS sidecars executable
        if: runner.os == 'macOS'
        run: chmod +x src-tauri/binaries/*-apple-darwin
      - name: Check formatting
        if: matrix.run_format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Run Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features --locked -- -D warnings
      - name: Run tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
